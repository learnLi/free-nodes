# 本仓库自维护的配置覆盖层（不参与上游同步）
#
# 加载顺序：fetch_config.yml（上游，每日同步） -> 本文件 -> local_fetch_config.yml（本地调试）
# 本文件的键会覆盖 fetch_config.yml 中的同名键。

# === 筛选参数 ===
# Stage 1（美国多轮一致性）与 Stage 3（中美多轮联合判定）共用。
filter:
  # 参与判定的最近 N 轮探测历史
  rounds: 6
  # 至少出现这么多轮才做判定。只出现一轮的判为「未定」，保守保留
  min_rounds: 2
  # 存活轮数占比达到多少算「跨轮全活」。
  #   1.0 = 每一轮都活（最严，节点数会随时间缓慢下降）
  #   0.7 = 70% 的轮次活就算稳定（更宽松，节点更多）
  alive_ratio: 1.0
  # 国内延迟上限（毫秒）。超过则从「大陆可用」里剔除。0 = 不限制。
  # 用**国内侧**的延迟（中位数）：美国到亚洲天生就慢（200~400ms），
  # 按美国侧筛会误杀「离美国远但离中国近」的好节点。
  max_latency_ms: 1500

# === 节点排序 ===
# 按协议偏好排序。依据是实测的国内可用率（中美多轮联合判定，2026-10-23）：
#   vmess 79% | vless 62% | trojan 53% | ss 25% | hysteria2 2%
# ss 排后面是因为 Shadowsocks 无 TLS、协议特征明显，最容易被 GFW 识别。
# 不在列表里的协议排在最后，保持原有相对顺序。
protocol_order:
  - vmess
  - vless
  - trojan
  - hysteria2
  - anytls
  - ss
  - http
  - https
  - socks5
  - socks

# === 多源共识 ===
# 「独立来源」的判定：同一个仓库的多个 URL 归并为一个来源
# （sources.list 里 free9999 有 3 条、proxypool 有 2 条，按 URL 计数会高估共识强度）
#
# 说明：实测 8 个独立来源之间几乎零重叠（源独占率 95~100%），
# 「多源共识」这个信号在当前源结构下**不存在**。统计代码保留下来
# （consensus.csv / sources.csv）作为诊断数据，但**不用于任何过滤**。
consensus:
  # 统计每个节点被几个独立来源收录，并输出 consensus.csv
  # 本阶段只统计、不做任何过滤
  enable_stats: true
  # 后续启用过滤时的阈值（待统计数据确认后再打开）
  min_sources: 0
