name: Sync upstream config

# 只同步上游「配置类」文件。
#   同步：sources.list / fetch_config.yml / abpwhite.txt
#   不同步：config.yml（本仓库自行维护，避免上游覆盖本地定制）
#            fetch.py / dynamic.py（本仓库自行维护）
# 上游 config.yml 的规则变化以「差异报告」形式产出，供人工跟进。

on:
  schedule:
    # 每天 UTC 03:23（北京时间 11:23）。注意：GitHub Actions 的 cron 一律按 UTC 解释，
    # 下面的 timedatectl 只影响任务内部的输出时间显示，不影响触发时刻。
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 迁出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 拉取上游快照
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/peasoft/NoMoreWalls.git
          git fetch --depth=1 upstream master
          echo "上游 commit：$(git rev-parse upstream/master)"

      - name: 同步配置类文件
        id: diff
        run: |
          set -euo pipefail
          # 注意：config.yml 不在其中——本仓库自行维护
          FILES="sources.list fetch_config.yml abpwhite.txt"
          git checkout upstream/master -- $FILES
          # git checkout 会同时更新 index 和工作区，所以判据必须是
          # --cached（index vs HEAD），用 git diff（工作区 vs index）
          # 永远看不到变化，同步就成了空转。
          #
          # 上游的 sources.list 没有末尾换行，本地有。不统一的话每次同步
          # 都会产生一个内容其实没变的「假差异」。
          for f in $FILES; do
            if [ -s "$f" ] && [ -n "$(tail -c 1 "$f")" ]; then
              printf '\n' >> "$f"
              git add "$f"
            fi
          done
          if git diff --cached --quiet -- $FILES; then
            echo "changed=unchanged" >> "$GITHUB_OUTPUT"
            echo "上游配置无变更，跳过提交"
          else
            echo "changed=changed" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- $FILES | tee diff.txt
          fi

      - name: 生成上游 config.yml 规则差异报告
        run: |
          set -euo pipefail
          git show upstream/master:config.yml > upstream-config.yml
          # 只比对 rules 段，proxy-groups / dns 差异单独看
          extract_rules() {
            sed -n '/^rules:/,$p' "$1" \
              | grep -vE '^\s*#' | grep -v '^rules:' | grep -vE '^\s*$' | sort
          }
          extract_rules config.yml          > /tmp/local-rules.txt
          extract_rules upstream-config.yml > /tmp/upstream-rules.txt
          comm -13 /tmp/local-rules.txt /tmp/upstream-rules.txt > /tmp/rules-added.txt || true
          comm -23 /tmp/local-rules.txt /tmp/upstream-rules.txt > /tmp/rules-removed.txt || true
          {
            echo "# 上游 config.yml 规则差异报告"
            echo
            echo "上游 commit: $(git rev-parse upstream/master)"
            echo "本地规则数: $(wc -l < /tmp/local-rules.txt)"
            echo "上游规则数: $(wc -l < /tmp/upstream-rules.txt)"
            echo "上游新增: $(wc -l < /tmp/rules-added.txt) 条"
            echo "上游删除: $(wc -l < /tmp/rules-removed.txt) 条"
            echo
            echo "## 新增规则"
            cat /tmp/rules-added.txt
            echo
            echo "## 删除规则"
            cat /tmp/rules-removed.txt
          } | tee config-diff.txt
          # 供 artifact 上传
          cp /tmp/rules-added.txt /tmp/rules-removed.txt . 2>/dev/null || true
          rm -f upstream-config.yml

      - name: 提交
        if: steps.diff.outputs.changed == 'changed'
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sources.list fetch_config.yml abpwhite.txt
          # 双重保险：暂存区为空时不提交，直接跳过
          if git diff --cached --quiet; then
            echo "暂存区为空，跳过提交"
            exit 0
          fi
          git commit -m "sync upstream $(date '+%Y-%m-%d %H:%M:%S')  ($(git rev-parse --short upstream/master))"
          git show --stat --oneline HEAD | tee -a diff.txt

      - name: 推送
        if: steps.diff.outputs.changed == 'changed'
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          git push origin main

      - name: 上传差异报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-config-diff
          path: |
            config-diff.txt
            rules-added.txt
            rules-removed.txt
          retention-days: 30
          if-no-files-found: ignore
