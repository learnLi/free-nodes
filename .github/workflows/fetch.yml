name: Fetch

on:
  workflow_dispatch:
  schedule:
    # 表达式生成 https://crontab.guru/
    # 每 3 小时一次，分钟数 17 以避开上游及整点高峰
    - cron: '17 */3 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'fetch_config.yml'
      - 'fetch_config.local.yml'
      - 'abpwhite.txt'
      - '**.py'
      - '**.sh'
      - 'requirements.txt'
      - '.github/workflows/**'

# 同一分支上的手动触发与定时触发互斥，避免两个任务同时推送
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 迁出代码
        uses: actions/checkout@v7

      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取节点
        run: python ./fetch.py

      # 可达性探测：只测量、不修改产物。
      # runner 在美国，探到的是「海外可达」，不等于「中国大陆可达」。
      # 探测失败不应影响主流程，因此 continue-on-error。
      - name: 可达性探测
        continue-on-error: true
        run: |
          python ./probe.py \
            --input list.meta.yml \
            --output probe.csv \
            --timeout 3 \
            --workers 64 \
            --ref 1.1.1.1:443 \
            --ref 8.8.8.8:443 \
            --ref github.com:443

      # GitHub Release 的资产名不允许包含 "/"，因此顶层订阅与配置片段
      # 分装到两个 Release：latest（订阅）与 snippets（片段）。
      # 按探测结论裁剪配置。保守策略：只剔除「确凿」的问题
      # （明文开放代理、端口无人监听、TLS 服务不符），
      # TCP 超时与 QUIC 协议一律保留——前者可能只对中国 IP 放行，
      # 后者 TCP 探测不适用。裁剪失败不影响主流程。
      - name: 按探测结果裁剪
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p pruned
          # 留档未裁剪版本，便于对照
          [ -f list.meta.yml ] && cp list.meta.yml list.meta.full.yml
          [ -f list.yml ] && cp list.yml list.yml.full.yml
          for f in list.meta.yml list.yml snippets/nodes.meta.yml snippets/nodes.yml; do
            [ -f "$f" ] || continue
            python ./prune.py \
              --input "$f" \
              --output "$f.pruned" \
              --probe probe.csv \
              --removed-report "pruned_$(echo "$f" | tr '/' '_').csv"
            mv "$f.pruned" "$f"
          done
          # V2Ray 明文链接列表同样裁剪（明文开放代理 / 确凿已死）
          if [ -f list_raw.txt ]; then
            cp list_raw.txt list_raw.full.txt
            python ./prune.py \
              --probe probe.csv \
              --removed-report pruned_list_raw.txt.csv \
              --v2ray-input list_raw.txt \
              --v2ray-output list_raw.pruned.txt
            mv list_raw.pruned.txt list_raw.txt
            # 重新生成 Base64 订阅
            base64 -w0 list_raw.txt > list.txt
          fi
          echo "--- 裁剪结果汇总 ---"
          for f in pruned/*.csv; do
            [ -f "$f" ] || continue
            echo "$f: $(($(wc -l < "$f") - 1)) 个节点被剔除"
          done

      # 本轮的时间戳：代表「这批节点的版本」。必须在 Stage 1 之前生成——
      # Stage 1 要用它给产物命名。放在这里（探测之后、裁剪之前）刚好。
      - name: 生成本轮时间戳
        run: |
          date -u '+%Y%m%d_%H%M' > .ts
          echo "本轮时间戳：$(cat .ts)"

      # Stage 1：用美国侧的多轮探测历史筛出「确实能用」的子集，交给 NAS 做国内探测。
      # 单轮探测噪声大——同一批地址连续几轮测下来，单轮说「活」的结果并不稳定。
      # 跨轮一致的才是真信号。
      - name: Stage 1：多轮一致性筛选
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          N=${STAGE1_ROUNDS:-6}
          MAPS=$(gh release view latest --json assets --jq '.assets[].name' \
            | grep -oE '^probe_[0-9]{8}_[0-9]{4}\.csv$' | sort | tail -n "$N" || true)
          HIST=""
          for m in ${MAPS//,/ }; do
            [ -n "$m" ] || continue
            if curl -sL --max-time 60 "$BASE/$m" -o "$m" && [ -s "$m" ]; then
              HIST="$HIST,$m"
            fi
          done
          echo "历史轮次：${HIST#,}"
          python3 ./scripts/stage1.py \
            --input list.meta.yml \
            --output list.meta.us.yml \
            --probe probe.csv \
            --history "${HIST#,}" \
            --min-rounds "${STAGE1_MIN_ROUNDS:-2}" \
            --report stage1.csv
          python3 ./scripts/validate_config.py list.meta.us.yml
          if [ ! -s .ts ]; then
            echo "::error::缺少本轮时间戳文件 .ts"
            exit 1
          fi
          cp list.meta.us.yml "list.meta.us.$(cat .ts).yml"
          cp stage1.csv "stage1.$(cat .ts).csv"

      # 配置一致性校验：Mihomo / Clash 遇到 proxy-group 引用了不存在的节点时，
      # 会拒绝加载整个配置，用户看到的是「订阅无效」。这类问题在 YAML 上
      # 看不出来，必须显式校验。校验不过就中止构建，绝不发布坏配置。
      - name: 校验配置一致性
        run: |
          set -euo pipefail
          python3 ./scripts/validate_config.py \
            list.meta.full.yml list.meta.yml list.yml.full.yml list.yml \
            snippets/nodes.meta.yml snippets/nodes.yml

      - name: 收集产物
        run: |
          set -euo pipefail
          rm -rf dist dist-snippets
          mkdir -p dist dist-snippets
          # 顶层订阅文件 -> Release: latest
          for f in list.txt list.meta.yml list.meta.full.yml list.yml list.yml.full.yml list_raw.txt list_raw.full.txt list_result.csv consensus.csv sources.csv probe.csv probe_summary.json probe_summary.md list.meta.us.yml stage1.csv; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          # 带时间戳的 Stage 1 产物，供 NAS 取用
          for f in list.meta.us.*.yml stage1.*.csv; do
            [ -f "$f" ] && cp "$f" dist/
          done
          # 配置片段 -> Release: snippets
          for f in snippets/*.yml; do
            [ -e "$f" ] || continue
            [ "$(basename "$f")" = "example.yml" ] && continue
            cp "$f" dist-snippets/
          done
          # 裁剪记录
          for f in pruned_*.csv; do
            [ -f "$f" ] || continue
            cp "$f" dist/
          done
          echo "订阅文件 $(find dist -type f | wc -l) 个，片段 $(find dist-snippets -type f | wc -l) 个"
          ls -la dist/ dist-snippets/
          # 本轮的时间戳：代表「这批节点的版本」。NAS 侧用同一批列表探测，
          # 才能和本轮的 probe.csv 严格对齐（否则两边节点池不是同一批）

      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          total=$(tail -n 1 list_result.csv | cut -d, -f3)
          {
            echo "自动生成于 $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo
            echo "合并去重后节点总数：**${total:-0}**"
            echo
            echo "### 订阅链接"
            echo
            echo '```'
            echo "Clash Meta : https://github.com/${{ github.repository }}/releases/latest/download/list.meta.yml"
            echo "Clash 原版 : https://github.com/${{ github.repository }}/releases/latest/download/list.yml"
            echo "V2Ray/通用 : https://github.com/${{ github.repository }}/releases/latest/download/list.txt"
            echo '```'
            echo
            echo "### 配置片段"
            echo
            echo '```'
            echo "https://github.com/${{ github.repository }}/releases/download/snippets/nodes.meta.yml"
            echo "https://github.com/${{ github.repository }}/releases/download/snippets/adblock.yml"
            echo '```'
            echo
            echo "### 多源共识分布"
            echo
            echo "「独立来源」= 订阅 URL 按仓库归并后的数量（同一仓库的多个文件只算一个来源）。"
            echo "被多个独立来源同时收录的节点，存活概率显著更高。"
            echo
            echo "两个层级：**节点哈希**（当前去重口径，含传输层特征）与 "
            echo "**服务器地址**（server:port，忽略传输特征）。"
            echo "两者差距大，说明去重口径过严把同一台服务器拆成了多条。"
            echo
            if [ -f consensus.csv ]; then
              echo '```'
              echo "层级 | 独立来源数 | 节点数 | 占比"
              tail -n +2 consensus.csv | while IFS=, read -r level n cnt pct; do
                [ -n "${level:-}" ] || continue
                echo "${level} | ${n} | ${cnt} | ${pct}"
              done
              echo '```'
            else
              echo "_本次未生成统计数据_"
            fi
            echo
            echo "### 各源贡献"
            echo
            echo "「独占地址数」= 该源提供的地址中，没有被其他独立来源收录的部分。"
            echo
            if [ -f sources.csv ]; then
              echo '```'
              echo "源 | 独立来源 | 节点数 | 地址数 | 独占地址数"
              tail -n +2 sources.csv | while IFS=, read -r idx ident nodes addrs excl url; do
                [ -n "${idx:-}" ] || continue
                echo "${idx} | ${ident} | ${nodes} | ${addrs} | ${excl}"
              done
              echo '```'
            fi
            echo
            echo "### 可达性探测（海外出口视角）"
            echo
            echo "CI runner 位于美国，探到的是**海外可达**，不等于中国大陆可达。"
            echo "被墙 / 跨境拥塞的节点在这里依然显示为「活」。"
            echo
            if [ -f probe_summary.md ]; then
              cat probe_summary.md
            else
              echo "_本次未完成探测_"
            fi
            echo
            echo "### 裁剪统计"
            echo
            echo "按探测结论剔除**确凿**的问题：明文开放代理、端口无人监听、"
            echo "TLS 服务不符。TCP 超时与 QUIC 协议一律保留——"
            echo "超时可能意味着服务器只对中国 IP 放行，QUIC 则无法用 TCP 探测。"
            echo
            if ls pruned_*.csv >/dev/null 2>&1; then
              echo '```'
              for f in pruned_*.csv; do
                [ -f "$f" ] || continue
                n=$(($(wc -l < "$f") - 1))
                [ "$n" -gt 0 ] && echo "$(basename "$f") : 剔除 $n 个"
              done
              echo '```'
            fi
          } > notes.md
          cat notes.md

      # 上传一个 Release，并清理本次不再产出的陈旧资产
      - name: 上传产物到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: latest
          SRC: dist
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "自动构建产物" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          else
            gh release edit "$TAG" --notes-file notes.md
          fi
          # 清理陈旧资产（本次不再生成的文件）。
          # 但要放过两类不属于本步骤的资产：
          #   1) 带时间戳的历史副本（probe_<ts>.csv / crosscheck_<ts>.*）——
          #      它们不在 dist/ 里，却是交叉比对按时间戳配对的依据
          #   2) crosscheck job 产出的交叉表与「大陆可用」子集——
          #      由另一个工作流上传，这里不能删
          while read -r old; do
            [ -n "$old" ] || continue
            case "$old" in
              probe_[0-9]*_*.csv|crosscheck_[0-9]*_*.csv|crosscheck_[0-9]*_*.md) continue ;;
              crosscheck.csv|crosscheck_summary.md|list.meta.cn.yml) continue ;;
            esac
            if [ ! -f "$SRC/$old" ]; then
              echo "删除陈旧资产：$old"
              gh release delete-asset "$TAG" "$old" -y
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          mapfile -t assets < <(find "$SRC" -type f | sort)
          if ! gh release upload "$TAG" "${assets[@]}" --clobber 2>&1 | tee upload.log; then
            echo "::error::上传失败，日志见 upload.log"
            gh release upload latest upload.log --clobber || true
            exit 1
          fi
          rm -f upload.log
          echo "已上传 ${#assets[@]} 个文件到 $TAG"

      # 带时间戳的美国侧探测结果。交叉比对按时间戳与国内侧数据配对，
      # 避免两边快照时间差太大导致节点池对不上（实测差 50 分钟能换掉 22% 的节点）
      - name: 上传带时间戳的探测结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TS=$(cat .ts)
          cp probe.csv "probe_${TS}.csv"
          gh release upload latest "probe_${TS}.csv" --clobber
          echo "已上传 probe_${TS}.csv（与国内侧 probe_domestic_<ts>.csv 按时间戳配对）"

      - name: 上传配置片段到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: snippets
          SRC: dist-snippets
        run: |
          set -euo pipefail
          # 必须标记为预发布：GitHub 的 releases/latest 取「最近发布的非预发布」，
          # 否则本 Release 会顶掉订阅 Release，导致 /releases/latest/download/list.* 全部 404
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "配置片段（proxy-providers / rule-providers）" \
              --notes "供 Clash / Clash Meta 以 proxy-providers、rule-providers 方式引用的配置片段。" \
              --target "$GITHUB_SHA" \
              --prerelease
          else
            gh release edit "$TAG" --prerelease
          fi
          while read -r old; do
            [ -n "$old" ] || continue
            if [ ! -f "$SRC/$old" ]; then
              echo "删除陈旧资产：$old"
              gh release delete-asset "$TAG" "$old" -y
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          mapfile -t assets < <(find "$SRC" -type f | sort)
          if ! gh release upload "$TAG" "${assets[@]}" --clobber 2>&1 | tee upload.log; then
            echo "::error::上传失败，日志见 upload.log"
            gh release upload latest upload.log --clobber || true
            exit 1
          fi
          rm -f upload.log
          echo "已上传 ${#assets[@]} 个文件到 $TAG"

      - name: 自检：产出必须齐全且指向正确
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "$latest_tag" != "latest" ]; then
            echo "::error::releases/latest 指向了 ${latest_tag}，应为 latest（订阅链接会 404）"
            exit 1
          fi
          # 订阅资产必须齐全
          assets=$(gh release view latest --json assets --jq '.assets[].name')
          for asset in list.meta.yml list.yml list.txt list.meta.full.yml; do
            if ! echo "$assets" | grep -qx "$asset"; then
              echo "::error::latest Release 缺少资产 ${asset}"
              exit 1
            fi
          done
          # 配置片段必须齐全
          snip=$(gh release view snippets --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          for asset in nodes.meta.yml adblock.yml proxy.yml direct.yml region.yml; do
            if ! echo "$snip" | grep -qx "$asset"; then
              echo "::error::snippets Release 缺少资产 ${asset}"
              exit 1
            fi
          done
          echo "自检通过：releases/latest -> ${latest_tag}，订阅与片段资产齐全"

      - name: 同步产物到 output 分支
        env:
          # GITHUB_TOKEN 不会自动注入 run: 的环境变量，必须显式映射
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .output
          mkdir -p .output/snippets
          cp -r dist/. .output/
          cp -r dist-snippets/. .output/snippets/
          # 带时间戳的节点列表：NAS 用它探测，结果才能与同批的美国数据对齐
          cp dist/list.meta.full.yml ".output/list_$(cat .ts).full.yml"
          # Stage 1 产物的带时间戳副本：NAS 探测它，并用这里的时间戳命名结果
          [ -f dist/list.meta.us.yml ] && cp dist/list.meta.us.yml ".output/list.meta.us_$(cat .ts).yml"
          cd .output
          git init -q -b output
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "build: $(date '+%Y-%m-%d %H:%M:%S') 自动构建产物"
          git push -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/output
          echo "output 分支已更新"

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fetch-logs
          path: |
            notes.md
            list_result.csv
          retention-days: 7
          if-no-files-found: ignore

  # 抓完节点就跑一次中美交叉比对。
  # 不能靠监听 output 分支的 push 来触发：output 分支只含构建产物，
  # 不含 .github/workflows/，GitHub 不会用那个 ref 上的工作流定义。
  crosscheck:
    needs: fetch
    uses: ./.github/workflows/crosscheck.yml
    permissions:
      contents: write

