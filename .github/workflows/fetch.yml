name: Fetch

on:
  workflow_dispatch:
  schedule:
    # 表达式生成 https://crontab.guru/
    # 每 3 小时一次，分钟数 17 以避开上游及整点高峰
    - cron: '17 */3 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'fetch_config.yml'
      - 'abpwhite.txt'
      - 'fetch.py'
      - 'dynamic.py'
      - 'requirements.txt'
      - '.github/workflows/fetch.yml'

# 同一分支上的手动触发与定时触发互斥，避免两个任务同时推送
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 迁出代码
        uses: actions/checkout@v7

      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取节点
        run: python ./fetch.py

      # GitHub Release 的资产名不允许包含 "/"，因此顶层订阅与配置片段
      # 分装到两个 Release：latest（订阅）与 snippets（片段）。
      - name: 收集产物
        run: |
          set -euo pipefail
          rm -rf dist dist-snippets
          mkdir -p dist dist-snippets
          # 顶层订阅文件 -> Release: latest
          for f in list.txt list.meta.yml list.yml list_raw.txt list_result.csv; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          # 配置片段 -> Release: snippets
          for f in snippets/*.yml; do
            [ -e "$f" ] || continue
            [ "$(basename "$f")" = "example.yml" ] && continue
            cp "$f" dist-snippets/
          done
          echo "订阅文件 $(find dist -type f | wc -l) 个，片段 $(find dist-snippets -type f | wc -l) 个"
          ls -la dist/ dist-snippets/

      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          total=$(tail -n 1 list_result.csv | cut -d, -f3)
          {
            echo "自动生成于 $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo
            echo "合并去重后节点总数：**${total:-0}**"
            echo
            echo "### 订阅链接"
            echo
            echo '```'
            echo "Clash Meta : https://github.com/${{ github.repository }}/releases/latest/download/list.meta.yml"
            echo "Clash 原版 : https://github.com/${{ github.repository }}/releases/latest/download/list.yml"
            echo "V2Ray/通用 : https://github.com/${{ github.repository }}/releases/latest/download/list.txt"
            echo '```'
            echo
            echo "### 配置片段"
            echo
            echo '```'
            echo "https://github.com/${{ github.repository }}/releases/download/snippets/nodes.meta.yml"
            echo "https://github.com/${{ github.repository }}/releases/download/snippets/adblock.yml"
            echo '```'
          } > notes.md
          cat notes.md

      # 上传一个 Release，并清理本次不再产出的陈旧资产
      - name: 上传产物到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: latest
          SRC: dist
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "自动构建产物" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          else
            gh release edit "$TAG" --notes-file notes.md
          fi
          # 清理陈旧资产（本次不再生成的文件）
          while read -r old; do
            [ -n "$old" ] || continue
            if [ ! -f "$SRC/$old" ]; then
              echo "删除陈旧资产：$old"
              gh release delete-asset "$TAG" "$old" -y
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          mapfile -t assets < <(find "$SRC" -type f | sort)
          gh release upload "$TAG" "${assets[@]}" --clobber
          echo "已上传 ${#assets[@]} 个文件到 $TAG"

      - name: 上传配置片段到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: snippets
          SRC: dist-snippets
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "配置片段（proxy-providers / rule-providers）" \
              --notes "供 Clash / Clash Meta 以 proxy-providers、rule-providers 方式引用的配置片段。" \
              --target "$GITHUB_SHA"
          fi
          while read -r old; do
            [ -n "$old" ] || continue
            if [ ! -f "$SRC/$old" ]; then
              echo "删除陈旧资产：$old"
              gh release delete-asset "$TAG" "$old" -y
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          mapfile -t assets < <(find "$SRC" -type f | sort)
          gh release upload "$TAG" "${assets[@]}" --clobber
          echo "已上传 ${#assets[@]} 个文件到 $TAG"

      - name: 同步产物到 output 分支
        env:
          # GITHUB_TOKEN 不会自动注入 run: 的环境变量，必须显式映射
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .output
          mkdir -p .output/snippets
          cp -r dist/. .output/
          cp -r dist-snippets/. .output/snippets/
          cd .output
          git init -q -b output
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "build: $(date '+%Y-%m-%d %H:%M:%S') 自动构建产物"
          git push -f "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/output
          echo "output 分支已更新"

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fetch-logs
          path: |
            notes.md
            list_result.csv
          retention-days: 7
          if-no-files-found: ignore
