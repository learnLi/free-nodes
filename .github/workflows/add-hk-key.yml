name: Add HK probe deploy key (one-off)

# 一次性工作流：把香港探活 VPS 的公钥注册成仓库的 deploy key，
# 这样它才能把 probe_hk_<ts>.csv 推到 probe-hk 分支。
# 用完即删。

on:
  push:
    paths:
      - '.github/workflows/add-hk-key.yml'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: 注册 deploy key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="hk-probe"
          KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAuBI+Kw4kPYmk/koIAAlbU7GpzX18TN8yXE4fDLdIgv hk-probe"
          REPO="${{ github.repository }}"
          {
            echo "REPO=${REPO}"
            echo "--- 现有 deploy key"
            gh api "repos/${REPO}/keys" --jq '.[] | "\(.id) \(.title) read_only=\(.read_only)"' 2>&1
            echo "--- 删除同名 key"
            for id in $(gh api "repos/${REPO}/keys" --jq ".[] | select(.title==\"${TITLE}\") | .id" 2>/dev/null); do
              gh api -X DELETE "repos/${REPO}/keys/${id}" 2>&1
              echo "已删除旧 key ${id}"
            done
            echo "--- 新增 deploy key"
            gh api -X POST "repos/${REPO}/keys" \
              -f title="$TITLE" -f key="$KEY" -F read_only=false 2>&1
            echo "--- 完成"
          } > hkkey.log 2>&1
          cat hkkey.log
          # 日志传不上去也要留下痕迹
          gh release upload latest hkkey.log --clobber 2>/dev/null || true
