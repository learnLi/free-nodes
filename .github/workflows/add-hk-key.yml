name: Add HK probe deploy key (one-off)

# 一次性工作流：把香港探活 VPS 的公钥注册成仓库的 deploy key，
# 这样它才能把 probe_hk_<ts>.csv 推到 probe-hk 分支。
# 用完即删。

on:
  push:
    paths:
      - '.github/workflows/add-hk-key.yml'

permissions: write-all

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: 注册 deploy key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub 默认用 `bash -e` 执行，gh api 一旦失败整个脚本就退出，
          # 日志反而写不出来。这里显式关掉 errexit。
          set +e
          set -uo pipefail
          TITLE="hk-probe"
          KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAuBI+Kw4kPYmk/koIAAlbU7GpzX18TN8yXE4fDLdIgv hk-probe"
          REPO="${{ github.repository }}"
          {
            echo "REPO=${REPO}"
            echo "--- 现有 deploy key"
            gh api "repos/${REPO}/keys" 2>&1
            echo "--- 删除同名 key"
            for id in $(gh api "repos/${REPO}/keys" --jq ".[] | select(.title==\"${TITLE}\") | .id" 2>/dev/null); do
              gh api -X DELETE "repos/${REPO}/keys/${id}" 2>&1
            done
            echo "--- 新增 deploy key"
            gh api -X POST "repos/${REPO}/keys" \
              -f title="$TITLE" -f key="$KEY" -F read_only=false 2>&1
            echo "--- 结束"
          } > hkkey.log 2>&1
          cat hkkey.log
          # 结果提交到临时分支：日志接口读不到，但分支内容能读到
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch --depth=1 origin "+refs/heads/hk-setup:refs/remotes/origin/hk-setup" 2>/dev/null || true
          if git rev-parse --verify origin/hk-setup >/dev/null 2>&1; then
            git checkout -B hk-setup origin/hk-setup
          else
            git checkout --orphan hk-setup
          fi
          cp hkkey.log hkkey.log 2>/dev/null || true
          git add -A
          git commit -q -m "hk-key: 部署密钥注册结果" || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/hk-setup || true
          exit 0
