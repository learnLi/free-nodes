name: Cross-check (US vs CN)

# 交叉比对两边的探活结果：
#   美国侧 —— GitHub Actions 产出（无 GFW 干扰，「已死」判定可信）
#   国内侧 —— NAS 推送到 probe-domestic 分支的 probe_domestic.csv
#
# 这是**可选**方案：需要国内探活数据（NAS 推送到 probe-domestic 分支）
# 才有意义。没数据时会安静跳过。
# 触发方式：手动、被 Fetch 用 workflow_call 调用、每 6 小时定时。
# NAS 侧脚本见 scripts/probe_domestic.sh（不部署 NAS 就完全用不到）。
#
# 注意原项目（上游 NoMoreWalls）本身不做任何节点质量判断，
# 节点可用性由客户端的 fallback / url-test 组实测决定。

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # 每 6 小时一次
    - cron: '41 */6 * * *'
# 注意：**不要**加 `push: branches: [probe-domestic]` 触发。
# 本工作流会把结果推回 probe-domestic 分支，而那个 push 又会触发本工作流，
# 形成自触发循环——concurrency 会把正在跑的那次取消掉，表现为推送步骤莫名失败。
#
# 也不能靠 `push: branches: [output]`：output 分支只含构建产物，
# 不含 .github/workflows/，GitHub 不会用那个 ref 上的工作流定义。
# 所以改为由 Fetch 工作流用 workflow_call 直接调用（见 fetch.yml 的
# crosscheck job），每 3 小时抓完节点就跑一次，保证表里的节点集合
# 与最新产物一致。

permissions:
  contents: write

concurrency:
  # 注意：被 Fetch 用 workflow_call 调用时，github.workflow 解析成**调用方**
  # 的名字（Fetch）。如果直接用 ${{ github.workflow }}-${{ github.ref }}，
  # 就会和调用方 Fetch 的工作流级 concurrency 撞同一个组——被调用方去抢
  # 调用方正持有的锁，直接死锁（表现为 crosscheck job 根本不出现）。
  # 所以这里加一个固定后缀区分。
  group: ${{ github.workflow }}-xcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 迁出代码
        uses: actions/checkout@v7

      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 取国内探活结果
        id: cn
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --depth=1 origin probe-domestic 2>/dev/null || {
            echo "国内探活分支尚不存在，跳过本次交叉比对"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          git show origin/probe-domestic:probe_domestic.csv > probe_domestic.csv
          echo "国内侧结果：$(wc -l < probe_domestic.csv) 行"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: 取美国探活结果与节点列表
        if: steps.cn.outputs.found == 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          # 美国侧探活结果
          curl -sL --max-time 60 "$BASE/probe.csv" -o probe_us.csv
          # 节点列表是生成物，不在 git 里，必须从 Release 取
          # （之前缺这一步，交叉比对会静默跳过子集输出）
          curl -sL --max-time 60 "$BASE/list.meta.full.yml" -o list.meta.full.yml
          for f in probe_us.csv list.meta.full.yml; do
            if [ ! -s "$f" ]; then
              echo "::error::取不到 $f"
              exit 1
            fi
          done
          echo "美国侧 $(wc -l < probe_us.csv) 行，节点列表 $(wc -c < list.meta.full.yml) 字节"

      - name: 交叉比对
        if: steps.cn.outputs.found == 'true'
        run: |
          set -euo pipefail
          python3 ./scripts/crosscheck.py \
            --us probe_us.csv \
            --cn probe_domestic.csv \
            --out-csv crosscheck.csv \
            --out-md crosscheck_summary.md \
            --input-list list.meta.full.yml \
            --out-cn-list list.meta.cn.yml
          # 产出必须齐全，否则下游会静默拿到空结果
          for f in crosscheck.csv crosscheck_summary.md list.meta.cn.yml; do
            if [ ! -s "$f" ]; then
              echo "::error::交叉比对没有产出 $f"
              exit 1
            fi
          done
          echo "产出齐全"

      - name: 发布交叉结果
        if: steps.cn.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 不加「release 存在就上传、否则跳过」的守卫——那会让失败变成静默跳过，
          # 而 Release 由 Fetch 工作流保证存在
          for f in crosscheck.csv crosscheck_summary.md list.meta.cn.yml; do
            [ -f "$f" ] || continue
            gh release upload latest "$f" --clobber
            echo "  已上传 $f"
          done
          # 带时间戳的历史副本，用来观察「国内可用」集合随时间的变化
          STAMP=$(date -u '+%Y%m%d_%H%M')
          cp crosscheck.csv "crosscheck_${STAMP}.csv"
          cp crosscheck_summary.md "crosscheck_${STAMP}.md"
          gh release upload latest "crosscheck_${STAMP}.csv" "crosscheck_${STAMP}.md" --clobber
          echo "已上传到 latest Release"

      # best-effort：把结果也回写到 probe-domestic 分支，方便用 git 看历史。
      # 推不上去不影响主流程——交叉结果已经发布到 Release 了。
      - name: 推送到 probe-domestic 分支
        if: steps.cn.outputs.found == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "起点: $(git rev-parse --short HEAD) 分支=$(git rev-parse --abbrev-ref HEAD)"
          # 显式 refspec，确保 remote-tracking ref 一定建出来
          git fetch --depth=1 origin \
            +refs/heads/probe-domestic:refs/remotes/origin/probe-domestic
          git checkout -B probe-domestic refs/remotes/origin/probe-domestic
          echo "切到: $(git rev-parse --short HEAD)"
          cp crosscheck.csv crosscheck_summary.md list.meta.cn.yml .
          # 逐个 add：git add 只要有一个 pathspec 不匹配就整体失败，
          # 一个都不会被暂存。所以先逐个确认存在
          for f in crosscheck.csv crosscheck_summary.md list.meta.cn.yml; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少产出文件 $f"
              exit 1
            fi
            git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git -c user.name="GitHub Actions" -c user.email="actions@github.com" \
              commit -m "crosscheck: $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:refs/heads/probe-domestic
            echo "已推送到 probe-domestic"
          fi

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crosscheck-logs
          path: |
            crosscheck.csv
            crosscheck_summary.md
          retention-days: 14
          if-no-files-found: ignore
