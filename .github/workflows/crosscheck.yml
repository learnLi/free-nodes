name: Cross-check (US vs CN)

# Stage 3：结合中美两侧的**多轮**探测历史，产出「大陆可用」订阅。
#
# 流水线分工：
#   Stage 1  fetch.yml   用美国侧多轮历史筛出「确实能用」的子集 -> list.meta.us.yml
#   Stage 2  NAS         在该子集上做国内探测，结果推到 probe-domestic 分支
#   Stage 3  本工作流     用中美多轮历史做最终判定 -> list.meta.cn.yml
#
# 用多轮而不是单轮：单轮探测噪声很大。同一批地址连测几轮，单轮说「活」的
# 结果并不稳定；跨轮一致的才是真信号。
#
# 触发：被 Fetch 用 workflow_call 调用（每 3 小时一次）+ 定时 + 手动。

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # 每 6 小时一次
    - cron: '41 */6 * * *'

concurrency:
  # 注意：被 Fetch 用 workflow_call 调用时，github.workflow 解析成**调用方**
  # 的名字（Fetch）。如果直接用 ${{ github.workflow }}-${{ github.ref }}，
  # 就会和调用方 Fetch 的工作流级 concurrency 撞同一个组——被调用方去抢
  # 调用方正持有的锁，直接死锁（表现为 crosscheck job 根本不出现）。
  # 所以这里加一个固定后缀区分。
  group: ${{ github.workflow }}-xcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 迁出代码
        uses: actions/checkout@v7

      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 取国内侧探测历史
        id: cn
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --depth=1 origin \
            "+refs/heads/probe-domestic:refs/remotes/origin/probe-domestic" 2>/dev/null || {
            echo "国内探活分支尚不存在，跳过本次交叉比对"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          mkdir -p cn
          N=$(python3 ./scripts/get_setting.py filter.rounds 6)
          # 取最近 N 轮带时间戳的国内探测结果
          MAPS=$(git ls-tree --name-only origin/probe-domestic \
            | grep -oE 'probe_domestic_[0-9]{8}_[0-9]{4}\.csv' | sort | tail -n "$N" || true)
          for m in $MAPS; do
            git show "origin/probe-domestic:$m" > "cn/$m" 2>/dev/null || true
          done
          # 本轮（无时间戳的那个）也算一份
          git show origin/probe-domestic:probe_domestic.csv > cn/probe_domestic_latest.csv 2>/dev/null || true
          COUNT=$(ls -1 cn/*.csv 2>/dev/null | wc -l)
          echo "国内侧轮次：$COUNT"
          ls -1 cn/ 2>/dev/null | head -10
          if [ "$COUNT" -eq 0 ]; then
            echo "没有国内侧数据，跳过"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: 取美国侧探测历史与节点列表
        id: us
        if: steps.cn.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          mkdir -p us
          # shell 变量不跨步骤传递，这里要自己取一次
          N=$(python3 ./scripts/get_setting.py filter.rounds 6)
          # 节点列表是生成物，不在 git 里，必须从 Release 取。
          # 用**已裁剪**的 list.meta.yml：未裁剪版里还留着明文 HTTP 代理，
          # 不该出现在「大陆可用」订阅里。
          curl -sL --max-time 60 "$BASE/list.meta.yml" -o list.meta.yml
          if [ ! -s list.meta.yml ]; then
            echo "::error::取不到 list.meta.yml"
            exit 1
          fi
          # 原版 Clash（老内核）的那份，用来产出老内核的大陆可用版
          curl -sL --max-time 60 "$BASE/list.yml" -o list.yml
          if [ ! -s list.yml ]; then
            echo "::error::取不到 list.yml"
            exit 1
          fi
          # 取最近 N 轮带时间戳的美国探测结果
          MAPS=$(gh release view latest --json assets --jq '.assets[].name' \
            | grep -oE '^probe_[0-9]{8}_[0-9]{4}\.csv$' | sort | tail -n "$N" || true)
          for m in $MAPS; do
            curl -sL --max-time 60 "$BASE/$m" -o "us/$m" || true
          done
          # 本轮
          curl -sL --max-time 60 "$BASE/probe.csv" -o us/probe_latest.csv
          COUNT=$(ls -1 us/*.csv 2>/dev/null | wc -l)
          echo "美国侧轮次：$COUNT"
          echo "节点列表 $(wc -c < list.meta.yml) 字节"

      - name: 交叉比对
        if: steps.cn.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # shell 变量不跨步骤传递，这里要重新取一次
          N=$(python3 ./scripts/get_setting.py filter.rounds 6)
          python3 ./scripts/crosscheck.py \
            --us us/probe_latest.csv \
            --us-history "$(ls -1 us/probe_2*.csv 2>/dev/null | paste -sd, -)" \
            --cn cn/probe_domestic_latest.csv \
            --cn-history "$(ls -1 cn/probe_domestic_2*.csv 2>/dev/null | paste -sd, -)" \
            --out-csv crosscheck.csv \
            --out-md crosscheck_summary.md \
            --input-list list.meta.yml \
            --out-cn-list list.meta.cn.yml \
            --input-list-clash list.yml \
            --out-cn-list-clash list.cn.yml \
            --rounds "$N" \
            2>&1 | tee crosscheck.log
          rc=${PIPESTATUS[0]}
          echo "crosscheck 退出码：$rc"
          if [ "$rc" != "0" ]; then
            gh release upload latest crosscheck.log --clobber || true
            echo "::error::交叉比对失败，日志已上传到 Release 的 crosscheck.log"
            exit 1
          fi
          for f in crosscheck.csv crosscheck_summary.md list.meta.cn.yml list.cn.yml; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少产出文件 $f"
              gh release upload latest crosscheck.log --clobber || true
              exit 1
            fi
          done
          # 产出必须自洽——Clash 遇到悬空引用会拒绝加载整个配置
          python3 ./scripts/validate_config.py --no-plaintext list.meta.cn.yml
          python3 ./scripts/validate_config.py --no-plaintext --no-meta-fields list.cn.yml
          echo "产出齐全"

      - name: 发布交叉结果
        if: steps.cn.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in crosscheck.csv crosscheck_summary.md list.meta.cn.yml list.cn.yml; do
            [ -f "$f" ] || continue
            gh release upload latest "$f" --clobber
            echo "  已上传 $f"
          done
          # 带时间戳的历史副本，用来观察「大陆可用」集合随时间的变化
          STAMP=$(date -u '+%Y%m%d_%H%M')
          cp crosscheck.csv "crosscheck_${STAMP}.csv"
          cp crosscheck_summary.md "crosscheck_${STAMP}.md"
          gh release upload latest "crosscheck_${STAMP}.csv" "crosscheck_${STAMP}.md" --clobber
          echo "已上传到 latest Release"

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crosscheck-logs
          path: |
            crosscheck.csv
            crosscheck_summary.md
            crosscheck.log
          retention-days: 14
          if-no-files-found: ignore
