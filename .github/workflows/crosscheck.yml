name: Cross-check (US vs CN)

# 交叉比对两边的探活结果：
#   美国侧 —— GitHub Actions 产出（无 GFW 干扰，「已死」判定可信）
#   国内侧 —— NAS 推送到 probe-domestic 分支的 probe_domestic.csv
#
# 这是**可选**方案：需要国内探活数据（NAS 推送到 probe-domestic 分支）
# 才有意义。没数据时会安静跳过。
# 触发方式：手动、被 Fetch 用 workflow_call 调用、每 6 小时定时。
# NAS 侧脚本见 scripts/probe_domestic.sh（不部署 NAS 就完全用不到）。
#
# 注意原项目（上游 NoMoreWalls）本身不做任何节点质量判断，
# 节点可用性由客户端的 fallback / url-test 组实测决定。

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # 每 6 小时一次
    - cron: '41 */6 * * *'
# 注意：**不要**加 `push: branches: [probe-domestic]` 触发。
# 本工作流会把结果推回 probe-domestic 分支，而那个 push 又会触发本工作流，
# 形成自触发循环——concurrency 会把正在跑的那次取消掉，表现为推送步骤莫名失败。
#
# 也不能靠 `push: branches: [output]`：output 分支只含构建产物，
# 不含 .github/workflows/，GitHub 不会用那个 ref 上的工作流定义。
# 所以改为由 Fetch 工作流用 workflow_call 直接调用（见 fetch.yml 的
# crosscheck job），每 3 小时抓完节点就跑一次，保证表里的节点集合
# 与最新产物一致。

permissions:
  contents: write

concurrency:
  # 注意：被 Fetch 用 workflow_call 调用时，github.workflow 解析成**调用方**
  # 的名字（Fetch）。如果直接用 ${{ github.workflow }}-${{ github.ref }}，
  # 就会和调用方 Fetch 的工作流级 concurrency 撞同一个组——被调用方去抢
  # 调用方正持有的锁，直接死锁（表现为 crosscheck job 根本不出现）。
  # 所以这里加一个固定后缀区分。
  group: ${{ github.workflow }}-xcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 迁出代码
        uses: actions/checkout@v7

      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 取国内探活结果
        id: cn
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --depth=1 origin probe-domestic 2>/dev/null || {
            echo "国内探活分支尚不存在，跳过本次交叉比对"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # 取最新的带时间戳的那一份（时间戳即探测时刻，UTC）
          CN_NAME=$(git ls-tree --name-only origin/probe-domestic \
            | grep -oE 'probe_domestic_[0-9]{8}_[0-9]{4}\.csv' | sort | tail -1 || true)
          if [ -n "$CN_NAME" ]; then
            git show "origin/probe-domestic:$CN_NAME" > probe_domestic.csv
            echo "国内侧用 $CN_NAME"
          else
            git show origin/probe-domestic:probe_domestic.csv > probe_domestic.csv
            CN_NAME="probe_domestic.csv"
            echo "国内侧用 probe_domestic.csv（无时间戳）"
          fi
          echo "cn_name=$CN_NAME" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: 取美国探活结果与节点列表
        id: us
        if: steps.cn.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          # 节点列表是生成物，不在 git 里，必须从 Release 取
          # （之前缺这一步，交叉比对会静默跳过子集输出）
          curl -sL --max-time 60 "$BASE/list.meta.full.yml" -o list.meta.full.yml
          for f in list.meta.full.yml; do
            if [ ! -s "$f" ]; then
              echo "::error::取不到 $f"
              exit 1
            fi
          done
          # 列出带时间戳的美国侧探测结果，供按时间戳配对
          CANDS=$(gh release view latest --json assets --jq '.assets[].name' \
            | grep -oE '^probe_[0-9]{8}_[0-9]{4}\.csv$' | paste -sd, - || true)
          echo "candidates=$CANDS" >> "$GITHUB_OUTPUT"
          # 没有历史候选时退回用最新的 probe.csv
          curl -sL --max-time 60 "$BASE/probe.csv" -o probe_us.csv
          echo "美国侧候选：${CANDS:-（无历史，用最新 probe.csv）}"
          echo "节点列表 $(wc -c < list.meta.full.yml) 字节"

      - name: 交叉比对
        if: steps.cn.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 ./scripts/crosscheck.py \
            --us probe_us.csv \
            --cn probe_domestic.csv \
            --out-csv crosscheck.csv \
            --out-md crosscheck_summary.md \
            --input-list list.meta.full.yml \
            --out-cn-list list.meta.cn.yml \
            --us-release-url "https://github.com/${{ github.repository }}/releases/latest/download" \
            --us-candidates "${{ steps.us.outputs.candidates }}" \
            --cn-file-name "${{ steps.cn.outputs.cn_name }}" \
            2>&1 | tee crosscheck.log
          rc=${PIPESTATUS[0]}
          echo "crosscheck 退出码：$rc"
          if [ "$rc" != "0" ]; then
            # 把日志传上去，方便排查（Actions 的 job 日志需要 admin 才能下）
            gh release upload latest crosscheck.log --clobber || true
            echo "::error::交叉比对失败，日志已上传到 Release 的 crosscheck.log"
            exit 1
          fi
          for f in crosscheck.csv crosscheck_summary.md list.meta.cn.yml; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少产出文件 $f"
              gh release upload latest crosscheck.log --clobber || true
              exit 1
            fi
          done
          echo "产出齐全"

      - name: 发布交叉结果
        if: steps.cn.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 不加「release 存在就上传、否则跳过」的守卫——那会让失败变成静默跳过，
          # 而 Release 由 Fetch 工作流保证存在
          for f in crosscheck.csv crosscheck_summary.md list.meta.cn.yml; do
            [ -f "$f" ] || continue
            gh release upload latest "$f" --clobber
            echo "  已上传 $f"
          done
          # 带时间戳的历史副本，用来观察「国内可用」集合随时间的变化
          STAMP=$(date -u '+%Y%m%d_%H%M')
          cp crosscheck.csv "crosscheck_${STAMP}.csv"
          cp crosscheck_summary.md "crosscheck_${STAMP}.md"
          gh release upload latest "crosscheck_${STAMP}.csv" "crosscheck_${STAMP}.md" --clobber
          echo "已上传到 latest Release"

      # 交叉结果已经发布到 Release，这里不再回写分支。
      # 分支 probe-domestic 只承担一个职责：**国内探活原始数据的通道**
      # （NAS 推数据进来，工作流读数据出去）。回写结果到分支是冗余的，
      # 而且在浅克隆 + 跨分支 fetch 的组合下反复出问题。
      # 需要看历史就看 Release 里的 crosscheck_<时间戳>.csv / .md 资产。

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crosscheck-logs
          path: |
            crosscheck.csv
            crosscheck_summary.md
          retention-days: 14
          if-no-files-found: ignore
